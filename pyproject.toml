[project]
name = "track-anything"
version = "0.1.0"
description = "EfficientTAM video object tracking (point/box prompt on frame 0), run on spark2 (DGX Spark, GB10)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "efficient-track-anything",
    "torch>=2.9",
    "torchvision>=0.24",
    "opencv-python-headless>=4.10",
    "huggingface-hub>=0.26",
    "transformers>=5.0",
    "aiohttp>=3.10",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned upstream commit.
# configs/ holds this rev's 512x512 YAMLs (the wheel omits them): refresh them when bumping rev.
efficient-track-anything = { git = "https://github.com/yformer/EfficientTAM", rev = "abcd061ebd3cc6e7527d152d75b890126aaa53f6" }
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Upstream setup.py pins gradio/moviepy/hf-hub==0.26.2 for its demo app; the tracker needs only these.
[[tool.uv.dependency-metadata]]
name = "efficient-track-anything"
version = "1.0"
requires-dist = ["torch", "torchvision", "numpy", "tqdm", "hydra-core>=1.3.2", "iopath>=0.1.10", "pillow"]
